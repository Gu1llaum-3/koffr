# koffr — example configuration
#
# This is the target form of the specification § 5.1, and the document koffr's
# own tests are run against: if it stopped being accepted, the build would fail
# (CFG-10). Copy it to /etc/koffr/koffr.yaml and edit it.
#
# Parsing is strict: a key koffr does not know is an error naming the key, its
# line and its section, never a warning. A typo must never silently disable a
# backup (E-032).
#
# Every sensitive field takes three forms — write ONE of them (E-033):
#     password:      literal, simplest and least advisable
#     password_env:  the name of an environment variable
#     password_file: the path of a file, which is what systemd credentials and
#                    Vault Agent hand you
#
# Check it before trusting it:
#     koffr config validate                 # reads the secrets it points at
#     koffr config validate --offline       # checks the shape only
#     koffr config show                     # prints it with every secret masked

agent:
  id: "prod-fr-01"
  timezone: "Europe/Paris"
  max_parallel_jobs: 2

encryption:
  recipients_file: /etc/koffr/recipients.txt   # clés publiques age

databases:
  - id: boutique-prod
    engine: postgresql
    host: 10.0.3.12
    port: 5432
    database: boutique
    user: koffr_backup
    password_file: /run/credentials/koffr.service/boutique
    tools: auto
    staging: auto                    # stage | stream | auto — voir §4.5
    schedule: "0 2 * * *"
    min_interval: 24h                # plancher opposable au serveur central
    allow_remote_schedule: true
    allow_restore: false             # restauration refusée tant que non armée
    destinations: [disque-local, s3-ovh]
    retention:
      last: 7
      daily: 14
      weekly: 8
      monthly: 12

  - id: erp-prod
    engine: mariadb
    host: 127.0.0.1
    port: 3306
    database: erp
    user: koffr_backup
    password_env: ERP_BACKUP_PASSWORD
    tools:
      strategy: exec                 # dump via le conteneur de la base
      container: erp-mariadb
    schedule: "30 1 * * *"
    destinations: [disque-local, sftp-nas]

destinations:
  - id: disque-local
    type: filesystem
    path: /srv/backups
  - id: s3-ovh
    type: s3
    endpoint: https://s3.gra.io.cloud.ovh.net
    region: gra
    bucket: koffr-prod
    access_key_id_env: OVH_ACCESS_KEY
    secret_access_key_env: OVH_SECRET_KEY
  - id: sftp-nas
    type: sftp
    host: nas.interne.exemple.fr
    port: 22
    user: koffr
    private_key_file: /etc/koffr/sftp_ed25519
    path: /volume1/backups

alerts:
  channels:
    - id: ops-mail
      type: email
      to: [ops@exemple.fr]
      smtp: { host: smtp.exemple.fr, port: 587, user: koffr, password_env: SMTP_PASSWORD }
    - id: ops-hook
      type: webhook
      url: https://hooks.exemple.fr/koffr
  rules:
    - on: [backup_failed, backup_missed, verify_failed, database_unreachable, tool_missing]
      channels: [ops-mail, ops-hook]

server:
  enabled: false
  url: https://koffr.interne.exemple.fr
  token_file: /etc/koffr/uplink.token
  delegate_alerts: true
  fallback_after: 15m               # reprise des alertes locales si injoignable
