# Toolchain for Koffr, pinned so that a fresh clone runs the same checks as CI.
#
#   mise install     fetch everything below
#   make hooks       install the git hooks
#   make ci          run everything the GitHub workflow runs
#
# Versions are pinned rather than floating: a linter that changes rules on its
# own turns an unrelated commit into a red build.
[tools]
# Patch releases matter: govulncheck flagged four standard-library issues in
# 1.26.0, all fixed by 1.26.6 and later. Bumping this is the response to that check, so it
# stays an explicit, reviewable commit rather than a silent float.
go = "1.26.8"
golangci-lint = "2.13.2"
lefthook = "2.1.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

[env]
# ENF-030: the release artifact is a single statically linked binary.
CGO_ENABLED = "0"

# CT-001: Koffr shells out to PostgreSQL client binaries it cannot embed, and
# the integration tests need them too. Homebrew keeps libpq off PATH on purpose;
# on Linux the PGDG packages land on PATH already and this entry is simply
# ignored.
_.path = ["/opt/homebrew/opt/libpq/bin"]
