name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The race detector is optional on a developer machine that has no C
      # toolchain (A-01); here it is not. Without it, the test task fails.
      KOFFR_REQUIRE_RACE: "1"

    steps:
      - uses: actions/checkout@v7

      # mise.toml is the single authority on tool versions, in CI as locally.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.3.9
          cache: true

      - run: mise run verify

      # E-117 is measured here and nowhere else: a size limit that does not
      # fail a build is a comment.
      - run: mise run release
