name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The race detector is optional on a developer machine that has no C
      # toolchain (A-01); here it is not. Without it, the test task fails.
      KOFFR_REQUIRE_RACE: "1"
      # Probes are tested against real servers. A runner without Docker would
      # skip them and leave a suite that is green and proves nothing.
      KOFFR_REQUIRE_DOCKER: "1"
      # E-075 promises an archive opens without koffr. Only the real age binary
      # can show that, so its absence is a failure here.
      KOFFR_REQUIRE_AGE: "1"

    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - uses: actions/checkout@v7

      # mise.toml is the single authority on tool versions, in CI as locally.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.3.9
          cache: true

      - run: mise run verify

      # E-117 is measured here and nowhere else: a size limit that does not
      # fail a build is a comment.
      - run: mise run release
