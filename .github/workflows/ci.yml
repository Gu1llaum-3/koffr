name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          check-latest: true
          # Koffr has no dependencies yet, so there is no go.sum to key a
          # cache on. Drop this line once the first dependency lands.
          cache: false

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^spikes/' || true)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # CT-001: the integration tests drive real client binaries, and pg_dump
      # must be at least the server's version. The runner ships an older one.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # The runner ships an older client. Put 17 first so that pg_dump and
          # pg_restore come from the same toolchain: an older pg_restore cannot
          # read a newer archive format.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Confirm the client toolchain
        run: |
          pg_dump --version
          pg_restore --version
          pg_dumpall --version

      - name: Test
        env:
          # GitHub runners have Docker. Requiring it turns a missing daemon into
          # a failure instead of a silently skipped integration suite, which
          # would be indistinguishable from a passing one.
          KOFFR_REQUIRE_DOCKER: '1'
        run: go test -race ./...

      # ENF-030: the release artifact is a single statically linked binary.
      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/koffr
          GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/koffr

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      # Action v7 is the one that speaks golangci-lint v2 config (version: "2").
      # Bump both together if the linter's major version moves again.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: govulncheck
        env:
          # setup-go v6 pins GOTOOLCHAIN=local, and govulncheck now requires a
          # newer Go than the project targets. Let the tool install pull the
          # toolchain it needs; Koffr itself still builds with go-version above.
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
