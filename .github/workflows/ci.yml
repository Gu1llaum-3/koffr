name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: true
          # Koffr has no dependencies yet, so there is no go.sum to key a
          # cache on. Drop this line once the first dependency lands.
          cache: false

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^spikes/' || true)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # ENF-030: the release artifact is a single statically linked binary.
      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/koffr
          GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/koffr

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      # Action v7 is the one that speaks golangci-lint v2 config (version: "2").
      # Bump both together if the linter's major version moves again.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
