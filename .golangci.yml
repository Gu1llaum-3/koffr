# Strict by design: a backup tool that silently ignores an error is worse than
# one that refuses to start.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - contextcheck    # every long operation must honour cancellation
    - copyloopvar
    - errorlint       # error wrapping must survive errors.Is / errors.As
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
  exclusions:
    rules:
      # gosec reasons about production code paths. A test reading its own
      # testdata is not a file inclusion vulnerability, and the noise would
      # push us to silence the linter where it actually matters.
      - path: _test\.go
        linters: [gosec]
    paths:
      # Probe code from milestone M0 is throwaway and deliberately unpolished.
      # No Go file lives there yet; the rule is in place for when one does.
      - spikes/

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
